name: Public acceleration confirmation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-confirmation.yml'
      - 'tests/corpus/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-confirmation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cohort:
    runs-on: windows-latest
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        fixture: [animation-bbb, waterfall-portrait, screen-recording, slow-motion-drops, earth-1080p60, earth-4k60]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Initialize evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/public-confirmation | Out-Null
          "commit=$env:GITHUB_SHA fixture=${{ matrix.fixture }}" | Set-Content artifacts/public-confirmation/attempt.txt
      - name: Resolve FFmpeg
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (!$installed) { throw 'FFmpeg installation failed after bounded retries' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
            $env:Path >> $env:GITHUB_PATH
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
      - name: Prefer direct executable pair from installed Chocolatey package
        shell: pwsh
        run: |
          if ($env:ChocolateyInstall) {
            $package = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools'
            if (Test-Path $package) {
              $pairs = @(Get-ChildItem $package -Recurse -File -Filter ffmpeg.exe | Where-Object { Test-Path (Join-Path $_.Directory.FullName 'ffprobe.exe') })
              if ($pairs.Count -eq 1) {
                "VANTA_FFMPEG_DIR=$($pairs[0].Directory.FullName)" >> $env:GITHUB_ENV
                Write-Host 'Using uniquely paired executable under installed package'
              } else { Write-Host 'No unique direct package pair; resource readings remain direct-child only' }
            }
          }
      - name: Verify acquisition retry and pin controls
        run: python -S tests/corpus/test_acquire.py
      - name: Acquire pinned public fixtures
        shell: pwsh
        run: |
          if ($env:VANTA_FFMPEG_DIR) { $env:Path = $env:VANTA_FFMPEG_DIR + ';' + $env:Path }
          python -S tests/corpus/prepare.py --work "$env:RUNNER_TEMP/vanta-public-confirmation" --report artifacts/public-confirmation --only ${{ matrix.fixture }}
      - name: Execute measured comparisons
        run: dotnet run --project tests/Vanta.Integration/Vanta.Integration.csproj -c Release -- --public-confirmation-fixture ${{ matrix.fixture }} artifacts/public-confirmation/intake.json artifacts/public-confirmation/results.jsonl
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: VANTA-public-confirmation-${{ matrix.fixture }}
          path: artifacts/public-confirmation/
          if-no-files-found: error
          retention-days: 14
