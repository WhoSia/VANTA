name: Heavy-media factorial throughput
on:
  push:
    branches: [main]
    paths:
      - 'tests/Vanta.Integration/HeavyFactorialScreen.cs'
      - '.github/workflows/heavy-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavy-factorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cohort:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [mixed-1080p30, motion-1080p60, texture-4k30]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Initialize evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/heavy-factorial | Out-Null
          "commit=$env:GITHUB_SHA" | Set-Content artifacts/heavy-factorial/attempt.txt
      - name: Resolve FFmpeg
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (!$installed) { throw 'FFmpeg installation failed after bounded retries' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
            $env:Path >> $env:GITHUB_PATH
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
      - name: Prefer direct executable pair from installed Chocolatey package
        shell: pwsh
        run: |
          if ($env:ChocolateyInstall) {
            $package = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools'
            if (Test-Path $package) {
              $pairs = @(Get-ChildItem $package -Recurse -File -Filter ffmpeg.exe | Where-Object { Test-Path (Join-Path $_.Directory.FullName 'ffprobe.exe') })
              if ($pairs.Count -eq 1) {
                "VANTA_FFMPEG_DIR=$($pairs[0].Directory.FullName)" >> $env:GITHUB_ENV
                Write-Host 'Using uniquely paired executable under installed package'
              } else { Write-Host 'No unique direct package pair; resource readings remain direct-child only' }
            }
          }
      - name: Execute five paired full-encoder repetitions
        run: dotnet run --project tests/Vanta.Integration/Vanta.Integration.csproj -c Release -- --heavy-factorial ${{ matrix.fixture }} artifacts/heavy-factorial/results.jsonl
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: VANTA-heavy-${{ matrix.fixture }}
          path: artifacts/heavy-factorial/
          if-no-files-found: error
          retention-days: 14
