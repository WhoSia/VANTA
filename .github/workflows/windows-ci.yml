name: Windows CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SDK diagnostics
        run: dotnet --info
      - name: Build desktop
        run: dotnet build src/Vanta.App/Vanta.App.csproj -c Release
      - name: Core smoke tests
        run: dotnet run --project tests/Vanta.Smoke/Vanta.Smoke.csproj -c Release
      - name: WPF control smoke tests
        run: dotnet run --project tests/Vanta.DesktopSmoke/Vanta.DesktopSmoke.csproj -c Release
      - name: Resolve FFmpeg
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
      - name: WPF real media workflow
        run: dotnet run --project tests/Vanta.DesktopSmoke/Vanta.DesktopSmoke.csproj -c Release -- --media
      - name: FFmpeg integration
        run: dotnet run --project tests/Vanta.Integration/Vanta.Integration.csproj -c Release
      - name: Ten-bit SDR research and HDR refusal
        run: dotnet run --project tests/Vanta.Integration/Vanta.Integration.csproj -c Release -- --ten-bit
      - name: Publish framework-dependent Windows x64 preview
        run: dotnet publish src/Vanta.App/Vanta.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/VANTA
      - name: Include and check dependency launcher
        shell: pwsh
        run: |
          Copy-Item scripts/Start-VANTA.ps1 artifacts/VANTA/Start-VANTA.ps1
          & ./artifacts/VANTA/Start-VANTA.ps1 -CheckOnly
      - name: Create versioned local package
        shell: pwsh
        run: |
          & ./scripts/Build-VANTA-Package.ps1 -PublishedDirectory artifacts/VANTA -OutputDirectory artifacts/package -Version 0.4.0 -Commit $env:GITHUB_SHA
      - name: Test local package installation
        shell: pwsh
        run: |
          & ./tests/Install-VANTA.Tests.ps1 -PackageDirectory artifacts/package -Version 0.4.0
      - name: Prepare single-extraction download
        shell: pwsh
        run: |
          Copy-Item -LiteralPath scripts/START-HERE-PORTABLE.txt -Destination artifacts/VANTA/START-HERE.txt
          & ./tests/Portable-VANTA.Tests.ps1 -PublishedDirectory artifacts/VANTA -PackageDirectory artifacts/package -Version 0.4.0 -Commit $env:GITHUB_SHA
      - name: Measure preview
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem artifacts/VANTA -Recurse -File | Measure-Object Length -Sum).Sum
          "Application files: $bytes bytes (external runtime and FFmpeg excluded)" >> $env:GITHUB_STEP_SUMMARY
          "Download only **VANTA-0.4.0-win-x64-package** below. Extract once into a new folder and run Vanta.App.exe. No inner ZIP or SDK required." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: VANTA-0.4.0-win-x64-package
          path: artifacts/VANTA/
          if-no-files-found: error
          retention-days: 7
