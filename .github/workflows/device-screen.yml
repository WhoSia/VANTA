name: Synthetic device screen
on:
  push:
    branches: [main]
    paths:
      - 'src/Vanta.Core/DeviceBenchmark.cs'
      - '.github/workflows/device-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve FFmpeg
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:Path
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
      - name: Compare CPU and NVIDIA on synthetic source
        run: dotnet run --project tests/Vanta.Integration/Vanta.Integration.csproj -c Release -- --device-screen hevc_nvenc device-screen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-device-screen
          path: device-screen.json
